<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hishab - হিসাব</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              darkBg: '#1A1A1A',
              darkSurface: '#242424',
              darkPrimary: '#E0E0E0',
              lightBg: '#F5F5F5',
              lightSurface: '#FFFFFF',
              lightPrimary: '#212121'
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas#watermarkCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-[#F5F5F5] dark:bg-[#1A1A1A] text-[#212121] dark:text-[#E0E0E0] min-h-screen flex flex-col transition-colors duration-200">

  <!-- Watermark Canvas Background -->
  <canvas id="watermarkCanvas"></canvas>

  <!-- Navigation Drawer (Side Menu) Overlay & Sheet -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity" onclick="toggleDrawer(false)"></div>
  <aside id="drawer" class="fixed top-0 left-0 w-64 h-full bg-white dark:bg-[#242424] shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col rounded-r-2xl">
    <div class="p-5 border-b border-gray-200 dark:border-gray-800">
      <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Menu</h2>
    </div>
    
    <div class="p-4 flex-1">
      <button onclick="toggleSettingsMenu()" class="w-full flex justify-between items-center py-3 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 font-medium">
        <span>Settings</span>
        <i id="settingsArrow" class="fa-solid fa-chevron-down text-xs transition-transform"></i>
      </button>
      
      <div id="settingsSubMenu" class="hidden pl-6 mt-1 space-y-1">
        <button onclick="openBalanceModal()" class="w-full text-left py-2 px-3 text-sm text-gray-600 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400">
          • Balance
        </button>
      </div>
    </div>

    <div class="p-4 text-center border-t border-gray-200 dark:border-gray-800">
      <p class="text-xs italic text-gray-400 font-serif">build by Abir</p>
    </div>
  </aside>

  <!-- App Wrapper -->
  <div class="relative z-10 flex flex-col min-h-screen max-w-md mx-auto w-full shadow-xl bg-[#F5F5F5] dark:bg-[#1A1A1A]">

    <!-- Top App Bar -->
    <header class="bg-[#212121] dark:bg-[#242424] text-white px-4 py-3.5 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <button onclick="toggleDrawer(true)" class="p-1 hover:bg-white/10 rounded-full transition-colors">
          <i class="fa-solid fa-ellipsis-vertical text-xl px-1"></i>
        </button>
        <h1 class="text-lg font-bold">Hishab - হিসাব</h1>
      </div>
      <button onclick="toggleTheme()" class="p-2 hover:bg-white/10 rounded-full transition-colors">
        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
      </button>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto">

      <!-- TAB 0: HOME -->
      <section id="tab-home" class="space-y-4">
        <!-- Balance Card -->
        <div class="bg-[#212121] dark:bg-[#242424] text-white p-6 rounded-2xl text-center shadow-lg">
          <p class="text-sm opacity-80 mb-1">বর্তমান ব্যালেন্স</p>
          <h2 id="balanceText" class="text-3xl font-bold">৳ 10000.00</h2>
        </div>

        <div>
          <h3 class="text-base font-bold mb-3 px-1">সাম্প্রতিক খরচসমূহ</h3>
          <div id="homeExpenseList" class="space-y-2"></div>
        </div>
      </section>

      <!-- TAB 1: HISTORY -->
      <section id="tab-history" class="space-y-4 hidden">
        <h3 class="text-xl font-bold px-1">খরচের পূর্ণাঙ্গ ইতিহাস</h3>
        <div id="historyExpenseList" class="space-y-4"></div>
      </section>

      <!-- TAB 2: PROFILE -->
      <section id="tab-profile" class="hidden min-h-[50vh] flex items-center justify-center">
        <p class="text-gray-500 font-medium">প্রোফাইল ফিচার শীঘ্রই আসছে...</p>
      </section>

    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openAddModal()" class="fixed bottom-20 right-6 md:right-[calc(50vw-200px)] z-30 bg-[#212121] dark:bg-[#E0E0E0] text-white dark:text-black w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
      <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-30 bg-white dark:bg-[#242424] border-t border-gray-200 dark:border-gray-800 flex justify-around py-2 shadow-lg">
      <button onclick="switchTab(0)" id="nav-0" class="flex flex-col items-center gap-1 text-xs font-semibold text-indigo-600 dark:text-indigo-400">
        <i class="fa-solid fa-house text-lg"></i>
        <span>Home</span>
      </button>
      <button onclick="switchTab(1)" id="nav-1" class="flex flex-col items-center gap-1 text-xs font-semibold text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span>History</span>
      </button>
      <button onclick="switchTab(2)" id="nav-2" class="flex flex-col items-center gap-1 text-xs font-semibold text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400">
        <i class="fa-solid fa-user text-lg"></i>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Modal 1: Add Expense -->
  <div id="addModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#242424] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold">নতুন খরচ যোগ করুন</h3>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-gray-500">টাকার পরিমাণ</label>
        <input type="number" id="inputAmount" placeholder="0.00" class="w-full bg-gray-100 dark:bg-[#1A1A1A] border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold mb-2 text-gray-500">ক্যাটাগরি সিলেক্ট করুন:</label>
        <div id="categoryChips" class="flex flex-wrap gap-2">
          <!-- Filter Chips rendered dynamically -->
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-gray-500">নোট (অপশনাল)</label>
        <input type="text" id="inputNote" placeholder="নোট লিখুন..." class="w-full bg-gray-100 dark:bg-[#1A1A1A] border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddModal()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">বাতিল</button>
        <button onclick="saveExpense()" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg">যোগ করুন</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Set Balance (PIN Verification) -->
  <div id="balanceModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#242424] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <h3 id="balanceModalTitle" class="text-lg font-bold">গোপন পিন দিন</h3>
      
      <div id="pinStep">
        <input type="password" id="inputPin" placeholder="পিন নম্বর" class="w-full bg-gray-100 dark:bg-[#1A1A1A] border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <p id="pinError" class="text-xs text-rose-500 mt-1 hidden">ভুল পিন!</p>
      </div>

      <div id="balanceStep" class="hidden">
        <input type="number" id="inputNewBalance" placeholder="নতুন টাকার পরিমাণ" class="w-full bg-gray-100 dark:bg-[#1A1A1A] border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeBalanceModal()" class="px-4 py-2 text-sm text-gray-500 rounded-lg">বাতিল</button>
        <button id="balanceConfirmBtn" onclick="verifyPinOrSaveBalance()" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg">ভেরিফাই</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Delete Confirmation -->
  <div id="deleteModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#242424] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold">খরচ মুছুন</h3>
      <p class="text-sm text-gray-500">আপনি কি নিশ্চিত যে এই খরচটি মুছে ফেলতে চান?</p>
      
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeDeleteModal()" class="px-4 py-2 text-sm text-gray-500 rounded-lg">No</button>
        <button onclick="confirmDeleteExpense()" class="px-5 py-2 text-sm bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg">Yes</button>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // App State
    let totalBalance = parseFloat(localStorage.getItem('hishab_balance')) || 10000.0;
    let expenses = JSON.parse(localStorage.getItem('hishab_expenses')) || [];
    let isDarkMode = localStorage.getItem('hishab_darkMode') === 'true';
    let selectedCategory = 'বাজার';
    let selectedTab = 0;
    let expenseToDeleteId = null;
    let isPinVerified = false;

    const categories = ["বাজার", "শপিং", "গাড়ি ভাড়া", "বাইরে খাওয়া", "অন্যান্য"];

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      renderCategoryChips();
      renderUI();
      initWatermarkCanvas();
    });

    // Theme Logic
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      localStorage.setItem('hishab_darkMode', isDarkMode);
      applyTheme();
      drawWatermark();
    }

    function applyTheme() {
      const icon = document.getElementById('themeIcon');
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        icon.className = 'fa-solid fa-sun text-yellow-400 text-lg';
      } else {
        document.documentElement.classList.remove('dark');
        icon.className = 'fa-solid fa-moon text-lg';
      }
    }

    // Navigation & Tabs
    function switchTab(index) {
      selectedTab = index;
      [0, 1, 2].forEach(i => {
        const tabEl = document.getElementById(`tab-${i}`);
        const navBtn = document.getElementById(`nav-${i}`);
        if (i === index) {
          tabEl.classList.remove('hidden');
          navBtn.className = 'flex flex-col items-center gap-1 text-xs font-semibold text-indigo-600 dark:text-indigo-400';
        } else {
          tabEl.classList.add('hidden');
          navBtn.className = 'flex flex-col items-center gap-1 text-xs font-semibold text-gray-400 hover:text-indigo-500';
        }
      });
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      if (open) {
        overlay.classList.remove('hidden');
        drawer.classList.remove('-translate-x-full');
      } else {
        overlay.classList.add('hidden');
        drawer.classList.add('-translate-x-full');
      }
    }

    function toggleSettingsMenu() {
      const sub = document.getElementById('settingsSubMenu');
      const arrow = document.getElementById('settingsArrow');
      sub.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    // Category Chips
    function renderCategoryChips() {
      const container = document.getElementById('categoryChips');
      container.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" type="button" class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${selectedCategory === cat ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:border-indigo-400'}">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategoryChips();
    }

    // Render Data
    function renderUI() {
      document.getElementById('balanceText').innerText = `৳ ${totalBalance.toFixed(2)}`;

      // Home Expenses (Last 5 reversed)
      const homeList = document.getElementById('homeExpenseList');
      const recentExpenses = [...expenses].reverse().slice(0, 5);
      
      if (recentExpenses.length === 0) {
        homeList.innerHTML = '<p class="text-sm text-gray-400 text-center py-6">কোনো রেকর্ড পাওয়া যায়নি</p>';
      } else {
        homeList.innerHTML = recentExpenses.map(item => createExpenseCardHTML(item, false)).join('');
      }

      // History Expenses (Grouped by Date)
      const historyList = document.getElementById('historyExpenseList');
      if (expenses.length === 0) {
        historyList.innerHTML = '<p class="text-sm text-gray-400 text-center py-6">ইতিহাস ফাঁকা</p>';
      } else {
        const grouped = {};
        [...expenses].reverse().forEach(exp => {
          const dateStr = new Date(exp.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          if (!grouped[dateStr]) grouped[dateStr] = [];
          grouped[dateStr].push(exp);
        });

        historyList.innerHTML = Object.keys(grouped).map(date => `
          <div>
            <h4 class="text-xs font-bold text-indigo-600 dark:text-indigo-400 mb-2">${date}</h4>
            <div class="space-y-2">
              ${grouped[date].map(item => createExpenseCardHTML(item, true)).join('')}
            </div>
          </div>
        `).join('');
      }

      // Save to localStorage
      localStorage.setItem('hishab_balance', totalBalance);
      localStorage.setItem('hishab_expenses', JSON.stringify(expenses));
    }

    function createExpenseCardHTML(expense, showTime) {
      const timeStr = new Date(expense.date).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      return `
        <div class="bg-white dark:bg-[#242424] p-4 rounded-xl flex items-center justify-between border border-gray-100 dark:border-gray-800 shadow-sm">
          <div class="flex-1">
            <h5 class="font-bold text-base">${expense.category}</h5>
            <p class="text-xs text-gray-400 mt-0.5">
              ${showTime ? timeStr : ''} ${expense.note ? (showTime ? ' • ' : '') + expense.note : ''}
            </p>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-rose-500 text-base">- ৳ ${expense.amount}</span>
            <button onclick="promptDeleteModal(${expense.id})" class="text-gray-400 hover:text-rose-500 p-1">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        </div>
      `;
    }

    // Add Expense Modal
    function openAddModal() {
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNote').value = '';
      selectedCategory = categories[0];
      renderCategoryChips();
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function saveExpense() {
      const amount = parseFloat(document.getElementById('inputAmount').value);
      const note = document.getElementById('inputNote').value.trim();

      if (isNaN(amount) || amount <= 0) return;

      const newExpense = {
        id: Date.now(),
        amount: amount,
        category: selectedCategory,
        note: note,
        date: Date.now()
      };

      expenses.push(newExpense);
      totalBalance -= amount;

      closeAddModal();
      renderUI();
    }

    // Balance & PIN Modal
    function openBalanceModal() {
      toggleDrawer(false);
      isPinVerified = false;
      document.getElementById('inputPin').value = '';
      document.getElementById('inputNewBalance').value = '';
      document.getElementById('pinError').classList.add('hidden');
      document.getElementById('pinStep').classList.remove('hidden');
      document.getElementById('balanceStep').classList.add('hidden');
      document.getElementById('balanceModalTitle').innerText = 'গোপন পিন দিন';
      document.getElementById('balanceConfirmBtn').innerText = 'ভেরিফাই';
      document.getElementById('balanceModal').classList.remove('hidden');
    }

    function closeBalanceModal() {
      document.getElementById('balanceModal').classList.add('hidden');
    }

    function verifyPinOrSaveBalance() {
      if (!isPinVerified) {
        const pin = document.getElementById('inputPin').value;
        if (pin === "143") {
          isPinVerified = true;
          document.getElementById('pinStep').classList.add('hidden');
          document.getElementById('balanceStep').classList.remove('hidden');
          document.getElementById('balanceModalTitle').innerText = 'নতুন ব্যালেন্স সেট করুন';
          document.getElementById('balanceConfirmBtn').innerText = 'সেট করুন';
        } else {
          document.getElementById('pinError').classList.remove('hidden');
        }
      } else {
        const newBal = parseFloat(document.getElementById('inputNewBalance').value);
        if (!isNaN(newBal)) {
          totalBalance = newBal;
          renderUI();
          closeBalanceModal();
        }
      }
    }

    // Delete Expense Modal
    function promptDeleteModal(id) {
      expenseToDeleteId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      expenseToDeleteId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }

    function confirmDeleteExpense() {
      if (expenseToDeleteId !== null) {
        expenses = expenses.filter(e => e.id !== expenseToDeleteId);
        renderUI();
        closeDeleteModal();
      }
    }

    // Canvas Background (AccountBackground Implementation)
    let canvas, ctx;
    const symbols = ["+", "-", "×", "÷", "%", "=", "৳", "∑", "$", "1+2=3", "5-3=2", "TAX", "HISHAB", "SAVE", "CASH", "9×5=45", "0.00", "7+8"];

    function initWatermarkCanvas() {
      canvas = document.getElementById('watermarkCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawWatermark();
    }

    function drawWatermark() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const color = isDarkMode ? 'rgba(129, 212, 250, 0.12)' : 'rgba(3, 155, 229, 0.12)';
      const stepX = 130;
      const stepY = 130;

      for (let x = -50; x < canvas.width + 100; x += stepX) {
        for (let y = -50; y < canvas.height + 100; y += stepY) {
          const seed = x * 1234 + y * 5678;
          const pseudoRandom = Math.sin(seed) * 10000 - Math.floor(Math.sin(seed) * 10000);
          
          const index = Math.floor(pseudoRandom * symbols.length);
          const rotation = pseudoRandom * 360 * (Math.PI / 180);
          const textSize = 16 + pseudoRandom * 14;
          const offsetX = (pseudoRandom - 0.5) * 60;
          const offsetY = (pseudoRandom - 0.5) * 60;

          ctx.save();
          ctx.translate(x + offsetX, y + offsetY);
          ctx.rotate(rotation);
          ctx.font = `bold ${textSize}px system-ui`;
          ctx.fillStyle = color;
          ctx.fillText(symbols[index], 0, 0);
          ctx.restore();
        }
      }
    }
  </script>
</body>
</html>
